<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="system-ui,Segoe UI,Arial,sans-serif">
<rect width="760" height="430" fill="#06080d"/>
<text x="380" y="30" fill="#eef4ff" font-size="18" font-weight="700" text-anchor="middle">Sơ đồ nối dây ESP32 DevKit V1 ↔ ILI9341 (3.3V)</text>
<rect x="40" y="55" width="220" height="340" rx="14" fill="#0d141f" stroke="#28d7ff" stroke-width="2"/>
<text x="150" y="82" fill="#28d7ff" font-size="15" font-weight="700" text-anchor="middle">ESP32 DevKit V1</text>
<rect x="500" y="55" width="220" height="285" rx="14" fill="#0d141f" stroke="#1597ff" stroke-width="2"/>
<text x="610" y="82" fill="#1597ff" font-size="15" font-weight="700" text-anchor="middle">ILI9341 320×240</text>
<g font-size="13" fill="#eef4ff">
<g stroke="#28d7ff" stroke-width="2"><line x1="260" y1="110" x2="500" y2="110"/><line x1="260" y1="140" x2="500" y2="140"/><line x1="260" y1="170" x2="500" y2="170"/><line x1="260" y1="200" x2="500" y2="200"/><line x1="260" y1="230" x2="500" y2="230"/><line x1="260" y1="260" x2="500" y2="260"/></g>
<text x="52" y="115">GPIO27</text><text x="508" y="115">CS</text>
<text x="52" y="145">GPIO25</text><text x="508" y="145">RST</text>
<text x="52" y="175">GPIO26</text><text x="508" y="175">DC</text>
<text x="52" y="205">GPIO13</text><text x="508" y="205">MOSI (SDI)</text>
<text x="52" y="235">GPIO14</text><text x="508" y="235">SCK</text>
<text x="52" y="265">GPIO35</text><text x="508" y="265">MISO (SDO)</text>
<line x1="260" y1="290" x2="500" y2="290" stroke="#ffc94d" stroke-width="2"/><text x="52" y="295">3V3</text><text x="508" y="295">VCC + LED</text>
</g>
<text x="52" y="318" fill="#eef4ff" font-size="13">GND</text><line x1="260" y1="314" x2="500" y2="314" stroke="#8296b0" stroke-width="2" stroke-dasharray="5 4"/><text x="508" y="318" fill="#eef4ff" font-size="13">GND</text>
<rect x="56" y="332" width="190" height="56" rx="10" fill="#111b29" stroke="#22d67a"/>
<text x="150" y="350" fill="#22d67a" font-size="12" font-weight="700" text-anchor="middle">Tùy chọn: còi báo động</text>
<text x="150" y="367" fill="#eef4ff" font-size="12" text-anchor="middle">GPIO32 → buzzer thụ động (+)</text>
<text x="150" y="381" fill="#eef4ff" font-size="12" text-anchor="middle">buzzer (−) → GND</text>
<text x="380" y="420" fill="#8296b0" font-size="12" text-anchor="middle">Nút BOOT (GPIO0) có sẵn trên board: bấm ngắn = đồng hồ, giữ 1–5 s = độ sáng, giữ 10 s = reset</text>
</svg>
