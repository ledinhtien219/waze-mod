[platformio]
src_dir = src

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
  -D CONFIG_ENABLE_ARDUINO_DEPENDS=1
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=0
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
  -D CONFIG_BT_NIMBLE_LOG_LEVEL=5
  -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
  -D LV_CONF_INCLUDE_SIMPLE
  -I src

lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341
  bblanchon/ArduinoJson@^7.0.0
  lvgl/lvgl@8.3.11
  h2zero/NimBLE-Arduino@2.5.1
