name: Build Arduino IDE Sketch

on:
  push:
    branches:
      - main
    paths:
      - "ESP32_WAZE_HUD/**"
      - ".github/workflows/build-arduino-ide.yml"
  workflow_dispatch:

jobs:
  build-arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "NimBLE-Arduino@2.5.1"

      - name: Compile Arduino sketch
        run: >
          arduino-cli compile
          --fqbn esp32:esp32:esp32
          --board-options PartitionScheme=min_spiffs
          --warnings default
          --output-dir arduino-build
          ESP32_WAZE_HUD

      - name: Verify NimBLE 2.x source
        shell: bash
        run: |
          grep -q "NimBLEDevice::getVersion" ESP32_WAZE_HUD/ESP32_WAZE_HUD.ino
          grep -q "enableScanResponse" ESP32_WAZE_HUD/ESP32_WAZE_HUD.ino
          ! grep -q "setScanResponse(true)" ESP32_WAZE_HUD/ESP32_WAZE_HUD.ino
          ! grep -q "wazeBtMemReleaseBlocked" ESP32_WAZE_HUD/ESP32_WAZE_HUD.ino

      - name: Upload Arduino firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: WazeHUD-ArduinoIDE-firmware-v1.8.0
          path: |
            arduino-build/*.bin
            arduino-build/*.elf

      - name: Package Arduino-ready source
        run: |
          rm -rf ESP32_WAZE_HUD/build
          zip -r WazeHUD-ArduinoIDE-v1.8.0.zip ESP32_WAZE_HUD ARDUINO_IDE.md

      - name: Upload Arduino-ready source
        uses: actions/upload-artifact@v4
        with:
          name: WazeHUD-ArduinoIDE-v1.8.0
          path: WazeHUD-ArduinoIDE-v1.8.0.zip
