name: Build Android Bridge

on:
  push:
    paths:
      - "android-bridge/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../WazeHUD-Bridge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WazeHUD-Bridge-apk
          path: WazeHUD-Bridge.apk
